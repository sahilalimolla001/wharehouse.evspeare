services:
  - type: web
    name: evsphere-warehouse-backend
    runtime: python
    rootDir: backend-flask
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m flask --app run.py validate-production && python -m flask --app run.py db upgrade
    initialDeployHook: python -m flask --app run.py init-db
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile - run:app
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: evsphere-warehouse-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_INSECURE_USER_HEADER
        value: false
      - key: INTEGRATION_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_STORAGE_BUCKET
        sync: false
      - key: GOOGLE_CLOUD_STORAGE_PUBLIC
        value: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_RANGE
        value: CurrentStock!A:H
      - key: GOOGLE_SHEETS_AUTO_SYNC
        value: true
      - key: GOOGLE_APPS_SCRIPT_WEBHOOK_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_TOKEN
        sync: false

  - type: web
    name: evsphere-warehouse-mobile
    runtime: static
    rootDir: mobile-app
    buildCommand: sh -c 'printf "window.WAREHOUSE_API_BASE = \"%s\";\n" "$WAREHOUSE_API_BASE" > config.js'
    staticPublishPath: .
    envVars:
      - key: WAREHOUSE_API_BASE
        sync: false

databases:
  - name: evsphere-warehouse-db
    plan: basic-256mb
