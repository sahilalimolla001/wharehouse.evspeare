{% extends "base.html" %}
{% block page_title %}Add Location{% endblock %}

{% block content %}
  <section class="panel">
    <form method="post" class="row g-3">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-3">
        <label class="form-label">Zone</label>
        <input class="form-control" name="zone" required placeholder="A">
      </div>
      <div class="col-md-3">
        <label class="form-label">Rack</label>
        <input class="form-control" name="rack" required placeholder="2">
      </div>
      <div class="col-md-3">
        <label class="form-label">Shelf</label>
        <input class="form-control" name="shelf" required placeholder="4">
      </div>
      <div class="col-md-3">
        <label class="form-label">Bin</label>
        <input class="form-control" name="bin_code" required placeholder="08">
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Save Location</button>
      </div>
    </form>
  </section>
{% endblock %}
